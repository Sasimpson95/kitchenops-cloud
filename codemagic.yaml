workflows:
  kitchenops-ios-release:
    name: KitchenOps iOS App Store Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: KitchenOps Codemagic

    environment:
      xcode: 26.4
      node: 22

      ios_signing:
        provisioning_profiles:
          - KitchenOps_App_Store
        certificates:
          - KitchenOps Distribution

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Typecheck
        script: |
          npm run typecheck

      - name: Production build
        script: |
          npm run build

      - name: iOS readiness check
        script: |
          npm run ios:check

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Apply iOS signing
        script: |
          xcode-project use-profiles \
            --project ios/App/App.xcodeproj

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false