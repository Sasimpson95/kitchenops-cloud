workflows:
  kitchenops-ios-check:
    name: KitchenOps iOS Build Check
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: 26.4
      node: 22

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Typecheck
        script: |
          npm run typecheck

      - name: Production build
        script: |
          npm run build

      - name: iOS readiness check
        script: |
          npm run ios:check

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Build iOS Simulator app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build